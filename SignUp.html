<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CpE Portal Sign Up</title>
    <link rel="stylesheet" href="CSS/mainStyle.css">
</head>
<br>
    <div class="container">
        <h2>Create an Account</h2>
        <form action="PHP/submit.php" method="POST">
            
            <div class="form-group">
                    <label for="firstName">Name</label>
                    <input type="text" id="Name" name="Name" placeholder="Name" required>
            </div>

            <div class="name-row">    
                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName" name="middleName" placeholder="Middle Name">
                </div>
            
                <div class="form-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" name="surname" placeholder="Last Name" required>
                </div>
            </div>

            <div class="name-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <label for="Student ID">Student ID (For Students Only)</label>
                    <input type="text" inputmode="numeric" id="studentID" name="studentID" placeholder="Student ID">
                </div>
            </div>

            <div class="name-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select name = "role"> 
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="Login.html">Log In</a>
        </div>
    </div>
</body>
</html>
